[package]
name = "switch-extractor-core"
version = "0.1.0"
edition = "2024"
authors = ["SPIN0ZAi <SPIN0ZAi@users.noreply.github.com>"]
description = "Core Nintendo Switch container extraction and cryptographic engine in Rust"

[dependencies]
aes = "0.8"
cipher = "0.4"
ctr = "0.9"
xts-mode = "0.5"
sha2 = "0.10"
zstd = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
byteorder = "1.5"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
tempfile = "3.17"
