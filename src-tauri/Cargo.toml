[package]
name = "switch-extractor-desktop"
version = "1.0.0"
description = "Fast, native Nintendo Switch 1 extractor and converter"
authors = ["SPIN0ZAi <SPIN0ZAi@users.noreply.github.com>"]
edition = "2024"

[lib]
name = "switch_extractor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0"
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
switch-extractor-core = { path = "../crates/switch-extractor-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
